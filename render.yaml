# Render Blueprint for ChronoGuard (https://render.com/docs/blueprint-spec).
# The backend is live at https://chronoguard-pt4n.onrender.com; this file records its settings
# so the deployment is reproducible. Secrets (Azure OpenAI, Hindsight) are set in the Render
# dashboard, never here.
services:
  - type: web
    name: chronoguard-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.15
      # Comma-separated frontend origin(s); "*" allows any origin (the API uses no cookies).
      - key: CHRONOGUARD_CORS_ORIGINS
        value: "*"
      - key: CHRONOGUARD_AZURE_OPENAI_API_KEY
        sync: false
      # Hindsight is enabled only when both the base URL and the API key are set.
      - key: CHRONOGUARD_HINDSIGHT_BASE_URL
        value: https://api.hindsight.vectorize.io
      - key: CHRONOGUARD_HINDSIGHT_API_KEY
        sync: false
      - key: CHRONOGUARD_HINDSIGHT_BANK_ID
        value: chronoguard

  - type: web
    name: chronoguard-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://chronoguard-pt4n.onrender.com
